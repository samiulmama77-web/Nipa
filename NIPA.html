<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NIPA</title><style>
:root{--ink:#351126;--pink:#ff2e7f}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}body{overflow:hidden;background:#fff0f6;color:var(--ink)}#app{position:relative;min-height:100dvh;overflow:hidden;background:linear-gradient(145deg,#fff7fb,#ffd8e8 55%,#ffeaf4)}.hearts{position:absolute;inset:0;overflow:hidden;pointer-events:none}.heart{position:absolute;bottom:-12vh;font-size:clamp(20px,7vw,42px);animation:float linear infinite;opacity:.72}@keyframes float{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.75}50%{transform:translate(18px,-55vh) rotate(16deg)}100%{transform:translate(-22px,-115vh) rotate(-18deg);opacity:0}}.screen{position:relative;z-index:2;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:min(94vw,560px);text-align:center;padding:34px 18px 28px;border:3px solid #fff;border-radius:32px;background:#ffffffb8;backdrop-filter:blur(9px);box-shadow:0 18px 60px #d52d7330}h1{font-size:clamp(34px,11vw,64px);line-height:.98;margin:0 0 28px;font-weight:1000;letter-spacing:-2px;text-transform:uppercase;text-shadow:3px 3px 0 #fff}.name{color:#ff2e7f}.buttons{position:relative;display:flex;gap:16px;justify-content:center;align-items:center;min-height:86px}.btn{border:0;border-radius:999px;padding:16px 30px;font-size:20px;font-weight:900;cursor:pointer;touch-action:manipulation;box-shadow:0 8px 20px #9c174c2e}.yes{background:#ff2e7f;color:#fff}.no{background:#fff;color:#ff2e7f;position:relative;transition:transform .12s ease}#celebrate{display:none;position:relative;z-index:5;min-height:100dvh;align-items:center;justify-content:center;text-align:center;padding:20px;overflow:hidden;background:radial-gradient(circle,#fff 0 12%,#ffd0e4 45%,#ff4c94 100%)}#celebrate.show{display:flex}.graffiti{position:absolute;inset:0;pointer-events:none;font-weight:1000;font-size:clamp(28px,9vw,64px);color:#fff;text-shadow:4px 4px 0 #111,-4px -4px 0 #ffef00}.g{position:absolute;transform:rotate(var(--r));font-style:italic}.g:nth-child(1){left:3%;top:7%;--r:-12deg}.g:nth-child(2){right:3%;top:18%;--r:15deg}.g:nth-child(3){left:7%;bottom:18%;--r:12deg}.g:nth-child(4){right:4%;bottom:8%;--r:-15deg}.g:nth-child(5){left:20%;top:38%;--r:8deg}.g:nth-child(6){right:18%;bottom:36%;--r:-8deg}.celebrate-box{position:relative;z-index:2}.celebrate-box h2{font-size:clamp(38px,12vw,76px);font-weight:1000;line-height:.95;margin:0;color:#fff;text-shadow:5px 5px 0 #111,-2px -2px 0 #ffed00;animation:bounce .55s infinite alternate}@keyframes bounce{to{transform:translateY(-10px) rotate(2deg)}}.dance{font-size:90px;margin-top:22px;animation:dance .45s infinite alternate ease-in-out}@keyframes dance{from{transform:rotate(-12deg) scale(1)}to{transform:rotate(12deg) scale(1.12)}}.confetti{position:absolute;inset:-20%;background:repeating-conic-gradient(from 0deg,#ffeb00 0 7deg,transparent 7deg 24deg,#00e5ff 24deg 31deg,transparent 31deg 48deg,#ff00a8 48deg 55deg,transparent 55deg 72deg);opacity:.15;animation:spin 8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body><main id="app"><div class="hearts" id="hearts"></div><section class="screen" id="ask"><div class="card"><h1><span class="name">NIPA</span>,<br>WILL YOU GO<br>ON A DATE<br>WITH ME?</h1><div class="buttons" id="arena"><button class="btn yes" id="yes" type="button">YES 💖</button><button class="btn no" id="no" type="button">NO 😏</button></div></div></section><section id="celebrate"><div class="confetti"></div><div class="graffiti"><span class="g">LOVE!</span><span class="g">YAY!</span><span class="g">NIPA 💕</span><span class="g">DATE!</span><span class="g">💖</span><span class="g">😍</span></div><div class="celebrate-box"><h2>I KNEW<br>YOU LOVE ME 😎</h2><div class="dance" aria-label="Dancing celebration">💃🕺</div></div></section></main><script>
const hearts=document.getElementById('hearts'),emojis=['❤️','💖','💕','💗','💓','💘','💝','💞'];for(let i=0;i<34;i++){const s=document.createElement('span');s.className='heart';s.textContent=emojis[i%emojis.length];s.style.left=Math.random()*100+'%';s.style.animationDuration=(5+Math.random()*7)+'s';s.style.animationDelay=(-Math.random()*10)+'s';s.style.fontSize=(20+Math.random()*28)+'px';hearts.appendChild(s)}const no=document.getElementById('no'),arena=document.getElementById('arena');let tries=0;function dodge(e){if(e)e.preventDefault();tries++;const a=arena.getBoundingClientRect(),b=no.getBoundingClientRect(),maxX=Math.max(5,(a.width-b.width)/2-5),maxY=34,x=(Math.random()*2-1)*maxX,y=(Math.random()*2-1)*maxY;no.style.transform=`translate(${x}px,${y}px) rotate(${(Math.random()*20-10).toFixed(1)}deg)`;if(tries%4===0)no.textContent=['NO 😏','NOPE 😂','CATCH ME 🏃','TRY AGAIN 😜'][Math.floor(Math.random()*4)]}no.addEventListener('pointerenter',dodge);no.addEventListener('pointerdown',dodge);no.addEventListener('touchstart',dodge,{passive:false});no.addEventListener('click',e=>{e.preventDefault();dodge(e);return false});document.getElementById('yes').addEventListener('click',()=>{document.getElementById('ask').style.display='none';document.getElementById('celebrate').classList.add('show')});
</script></body></html>
